<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<title>Canetoad · Maps (interactive demo)</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
<style>.page-header{display:none}.map-wrap{margin:0;border:0;border-radius:0;min-height:0}</style>
</head>
<body>

<header class="page-header">
  <div>
    <h1>Maps</h1>
    <span class="eyebrow">drill-hole collars · open-file data from GSNSW (DIGS) and GSWA (WAMEX) · static demo</span>
  </div>
  <a class="back" href="../maps-viewer.html">← Back to dashboard snapshot</a>
</header>
<main class="map-wrap">
  <div id="map" aria-label="Interactive map of drill-hole collars"></div>

  <div class="panel panel-top">
    <label for="maps-source" class="panel-label">Source</label>
    <select id="maps-source">
      <option value="all">ALL</option>
      <option value="wa">AUS — WAMEX</option>
      <option value="nsw">AUS — GSNSW (DIGS)</option>
    </select>
  </div>

  <div class="panel panel-bottom" aria-live="polite">
    <div class="panel-label">Drill Collars</div>
    <div class="panel-count"><span id="collar-count">Loading…</span><span id="source-label" class="panel-src">ALL</span></div>
    <div class="panel-hint" id="collar-hint">Clusters below zoom 10 · collars at zoom 10+</div>
  </div>
</main>
<noscript><p class="noscript">This interactive map needs JavaScript. Still images are on the <a href="../maps-viewer.html">Maps snapshot page</a>.</p></noscript>
<script src="vendor/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
